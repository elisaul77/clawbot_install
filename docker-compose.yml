version: '3.8'

services:
  # 1. VPN Service (WireGuard) - Secure Access to the Network
  vpn:
    image: ghcr.io/wg-easy/wg-easy
    container_name: clawbot_vpn
    environment:
      - WG_HOST=${VPN_PUBLIC_IP} # Your server's public IP
      - PASSWORD_HASH=${VPN_PASSWORD_HASH} # Generate with: docker run --rm ghcr.io/wg-easy/wg-easy wgpw YOUR_PASSWORD
      - WG_PORT=51820
      - WG_DEFAULT_ADDRESS=10.13.13.x
      - WG_DEFAULT_DNS=1.1.1.1
      - WG_ALLOWED_IPS=10.13.13.0/24,172.22.0.0/24
    ports:
      - '51820:51820/udp' # UDP for VPN traffic
      - '51821:51821/tcp' # Web UI for managing VPN users
    volumes:
      - ./data/wireguard:/etc/wireguard
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      backend_net:
        ipv4_address: 172.22.0.6

  # 2. Reverse Proxy (Nginx) - SSL Termination and Routing
  proxy:
    image: nginx:latest
    container_name: clawbot_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
      - ./data/proxy_logs:/var/log/nginx
    restart: unless-stopped
    depends_on:
      - gateway
    networks:
      backend_net:
        ipv4_address: 172.22.0.9

  # 3. Clawbot Gateway (The AI Agent)
  gateway:
    build: 
      context: .
      dockerfile: Dockerfile
    image: clawbot-custom:latest
    container_name: clawbot_gateway
    environment:
      - NODE_ENV=production
      - CLAWDBOT_GATEWAY_TOKEN=${CLAWDBOT_TOKEN}
    volumes:
      - ./data/clawbot_home/.clawdbot:/home/clawbot/.clawdbot
      - ./data/clawbot_home/clawd:/home/clawbot/clawd
    restart: unless-stopped
    networks:
      backend_net:
        ipv4_address: 172.22.0.14

  # Certbot (Optional: for auto-renewing SSL certs)
  certbot:
    image: certbot/certbot
    container_name: clawbot_certbot
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  backend_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/24
